name: fred-probe

# Run by hand. FRED's CSV answers in about a second from home but never answered train.yml on
# GitHub's runners (2026-10-27), so this asks a few FRED routes from a runner and prints how each
# one answered: HTTP status (000 = no answer in 30 s), seconds to the first byte, bytes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask FRED
        run: |
          ua="stock-advisor/0.1 (personal research)"
          probe() {
            label="$1"; shift
            result=$(curl -s -o /dev/null -m 30 -w "%{http_code} first-byte=%{time_starttransfer}s bytes=%{size_download}" "$@" || true)
            echo "$label: $result"
          }
          probe "csv, 8 years, our UA" -A "$ua" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=T10Y2Y&cosd=2018-10-27"
          probe "csv, one month, our UA" -A "$ua" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=T10Y2Y&cosd=2026-10-01"
          probe "csv, 8 years, curl's UA" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=T10Y2Y&cosd=2018-10-27"
          probe "csv over HTTP/1.1, our UA" --http1.1 -A "$ua" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=T10Y2Y&cosd=2018-10-27"
          probe "series page, our UA" -A "$ua" "https://fred.stlouisfed.org/series/T10Y2Y"
          probe "ALFRED csv, our UA" -A "$ua" "https://alfred.stlouisfed.org/graph/alfredgraph.csv?id=T10Y2Y"
          probe "API host, no key (400 expected)" -A "$ua" "https://api.stlouisfed.org/fred/series?series_id=T10Y2Y"
          probe "Bank of Canada Valet, our UA" -A "$ua" "https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json?recent=5"
