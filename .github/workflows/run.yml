name: run

# Each run has an EDT and an EST cron (GitHub cron is UTC). advisor.run checks the NYSE and
# TSX calendars and the current ET time, then does nothing unless this is the right slot.
on:
  schedule:
    - cron: "15 12 * * 1-5"  # pre-open, EDT
    - cron: "15 13 * * 1-5"  # pre-open, EST
    - cron: "15 16 * * 1-5"  # early-close days, EDT
    - cron: "15 17 * * 1-5"  # early-close days, EST
    - cron: "15 19 * * 1-5"  # pre-close, EDT
    - cron: "15 20 * * 1-5"  # pre-close, EST
  workflow_dispatch:
    inputs:
      kind:
        description: Run kind to force (ignores the schedule guard)
        type: choice
        options: [pre_open, pre_close, early_close]
        default: pre_open

permissions:
  contents: read

concurrency:
  group: pipeline-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked --no-dev --extra nlp  # nlp: CPU PyTorch and transformers for FinBERT
      - uses: actions/cache/restore@v4  # the FinBERT model (about 440 MB); the key is its pinned revision
        id: finbert
        with:
          path: ~/.cache/huggingface
          key: finbert-0bc2ac10dda6929bcb1f77ccc43c7ec5c424f031  # FINBERT_REVISION in advisor/news/sentiment.py
      - uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache
          key: advisor-cache-${{ github.run_id }}
          restore-keys: advisor-cache-
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ADVISOR_CACHE_DIR: .cache
          FORCE_KIND: ${{ inputs.kind }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            uv run python -m advisor.run --force-kind "$FORCE_KIND"
          else
            uv run python -m advisor.run
          fi
      - uses: actions/cache/save@v4
        if: always()  # keep what a failed run fetched, so the retry doesn't refetch it all
        with:
          path: pipeline/.cache
          key: advisor-cache-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && steps.finbert.outputs.cache-hit != 'true'  # a failed run keeps the model it downloaded
        with:
          path: ~/.cache/huggingface
          key: finbert-0bc2ac10dda6929bcb1f77ccc43c7ec5c424f031  # FINBERT_REVISION in advisor/news/sentiment.py
