name: train

# Weekly, on Saturday when neither market trades: rebuild the training data from scratch, then
# train, backtest and promote each market's model in this same job. Nothing is kept between
# weeks except the stored models. A failed build or market fails the job (GitHub emails the
# owner) while that market's active model stays in use.
on:
  schedule:
    - cron: "0 10 * * 6"  # Saturday 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked --no-dev
      - name: Build training data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: uv run python -m advisor.training.build --out "$RUNNER_TEMP/training"
      - name: Train, backtest and promote the stock models
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m advisor.model.weekly --data "$RUNNER_TEMP/training"
      - uses: actions/upload-artifact@v4  # what was built, what was missing and how each model fared, for 30 days
        if: always()
        with:
          name: training-report
          path: |
            ${{ runner.temp }}/training/manifest.json
            ${{ runner.temp }}/training/model-report.json
          retention-days: 30
          if-no-files-found: ignore
