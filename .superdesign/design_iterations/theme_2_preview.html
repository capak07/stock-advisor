<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass theme preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme_2.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root { --font-geist: 'Geist'; --font-geist-mono: 'Geist Mono'; } /* next/font defines these in the app */
  * { box-sizing: border-box; }
  body { margin: 0 !important; font-family: var(--font-sans) !important; background: #1b1418 !important; color: var(--foreground); -webkit-font-smoothing: antialiased; }
  .wrap { display: grid; grid-template-columns: 1fr; min-height: 100dvh; }
  @media (min-width: 1100px) { .wrap { grid-template-columns: 1fr 1fr; } }
  .pane { position: relative; overflow: hidden; padding: 20px 16px 120px; color: var(--foreground); min-height: 900px; }
  @media (min-width: 640px) { .pane { padding: 28px 28px 130px; } }
  .pane .aurora { position: absolute; }
  .tag { font: 500 11px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); margin-bottom: 14px; }
  .stack { display: grid; gap: 14px; max-width: 560px; margin: 0 auto; }
  .num { font-family: var(--font-mono) !important; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .muted { color: var(--muted-foreground); }
  .gain { color: var(--gain); } .loss { color: var(--loss); }
  h1, h2 { margin: 0; color: var(--foreground) !important; font-family: var(--font-sans) !important; }
  h1 { font-size: 26px !important; font-weight: 650 !important; letter-spacing: -0.02em; }
  h2 { font-size: 15px !important; font-weight: 600 !important; letter-spacing: -0.01em; }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 999px; }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: 14px; }
  .search svg { width: 16px; height: 16px; }
  .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 999px; background: var(--secondary); border: 1px solid var(--glass-border); color: var(--foreground); }
  .icon-btn svg { width: 16px; height: 16px; }

  .card-pad { padding: 18px 20px; }
  .hero { border-radius: var(--radius-xl); padding: 22px 22px 18px; }
  .hero .big { font: 600 38px/1.05 var(--font-mono); letter-spacing: -0.03em; margin: 6px 0 4px; }
  .label { font: 500 11px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted-foreground); }
  .spark { margin-top: 14px; height: 56px; width: 100%; }

  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; }
  .sym { font: 600 14px/1 var(--font-mono); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; }
  .chip.sell { color: var(--action-sell); background: var(--loss-soft); }
  .chip.trim { color: var(--action-trim); background: var(--trim-soft); }
  .chip.hold { color: var(--action-hold); background: var(--hold-soft); }
  .chip.wait { color: var(--attention); background: var(--attention-soft); }
  .chip.on { color: var(--gain); background: var(--gain-soft); }

  .trade { display: grid; gap: 10px; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .lvl { padding: 10px; border-radius: var(--radius-md); background: var(--muted); }
  .lvl b { display: block; font: 600 15px/1.2 var(--font-mono); margin-top: 4px; }
  .verdict { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted-foreground); }
  .verdict svg { width: 15px; height: 15px; }

  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; font: 500 14px/1 var(--font-sans); border: 1px solid transparent; cursor: pointer; }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); box-shadow: inset 0 1px 0 oklch(1 0 0 / .25), var(--shadow-sm); }
  .btn-glass { color: var(--foreground); }
  .btn-glass.glass { border-radius: 999px; }
  .input { height: 40px; flex: 1; min-width: 160px; border-radius: var(--radius-md); border: 1px solid var(--input); background: var(--secondary); padding: 0 12px; font: 14px var(--font-sans); color: var(--foreground); }
  .input:focus { outline: 2px solid var(--ring); outline-offset: 2px; }

  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .sw { height: 34px; border-radius: 10px; border: 1px solid var(--glass-border); }
  .sw-l { font: 500 10px/1.3 var(--font-mono); color: var(--muted-foreground); margin-top: 4px; text-align: center; }

  .tabbar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(420px, calc(100% - 32px));
            display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: var(--radius-xl); }
  .tab { display: grid; justify-items: center; gap: 3px; padding: 7px 2px; border-radius: 18px; font-size: 10.5px; font-weight: 500; color: var(--muted-foreground); }
  .tab svg { width: 20px; height: 20px; }
  .tab.on { color: var(--foreground); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--glass-border); }
  .tab.on svg { color: var(--brand); }
</style>
</head>
<body>
<!-- The liquid filter: a gentle displacement that bends what is behind the bar (Chrome-based browsers). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="wrap">
  <section class="pane" id="light"></section>
  <section class="pane dark" id="dark"></section>
</div>

<template id="tpl">
  <div class="aurora"></div>
  <div class="stack">
    <div class="tag" data-mode></div>

    <div class="topbar glass glass-strong glass-liquid">
      <div class="search"><i data-lucide="search"></i> Search any stock…</div>
      <span class="icon-btn"><i data-lucide="refresh-cw"></i></span>
      <span class="icon-btn"><i data-lucide="moon"></i></span>
    </div>

    <div>
      <div class="label">Saturday, Nov 21 · markets closed</div>
      <h1 style="margin-top:6px">Today</h1>
    </div>

    <div class="hero glass">
      <div class="label">Portfolio · TFSA and Non-reg</div>
      <div class="big num">$12,340.18</div>
      <div class="num gain" style="font-size:14px">▲ $148.20 (1.2%) today</div>
      <svg class="spark" viewBox="0 0 300 56" preserveAspectRatio="none">
        <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--chart-1)" stop-opacity=".16"/><stop offset="1" stop-color="var(--chart-1)" stop-opacity="0"/></linearGradient></defs>
        <path d="M0 44 L30 40 L60 42 L90 33 L120 36 L150 26 L180 29 L210 20 L240 23 L270 12 L300 14 L300 56 L0 56Z" fill="url(#g)"/>
        <path d="M0 44 L30 40 L60 42 L90 33 L120 36 L150 26 L180 29 L210 20 L240 23 L270 12 L300 14" fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M0 46 L60 45 L120 40 L180 37 L240 33 L300 30" fill="none" stroke="var(--chart-3)" stroke-width="1.5" stroke-dasharray="4 4"/>
      </svg>
    </div>

    <div class="glass card-pad">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <h2>Needs your attention · 2</h2><span class="label">run Fri 3:15 PM</span>
      </div>
      <div class="row"><span class="chip sell">Sell</span><div><div class="sym">ABC</div><div class="muted" style="font-size:12.5px;margin-top:3px">Stop hit at $41.20</div></div><span class="num loss">−6.1%</span></div>
      <div class="row"><span class="chip trim">Trim</span><div><div class="sym">XYZ</div><div class="muted" style="font-size:12.5px;margin-top:3px">16% of your portfolio</div></div><span class="num gain">+22.4%</span></div>
      <div class="row"><span class="chip hold">Hold</span><div class="muted" style="font-size:13px">6 more holdings</div><i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--muted-foreground)"></i></div>
    </div>

    <div class="glass card-pad trade">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2><span class="num muted">1</span>&nbsp; TSLA</h2><span class="chip on">Triggered 10:15</span>
      </div>
      <div class="levels">
        <div class="lvl"><span class="label">Entry</span><b>364.18</b></div>
        <div class="lvl"><span class="label">Target</span><b class="gain">370.04</b></div>
        <div class="lvl"><span class="label">Stop</span><b class="loss">358.32</b></div>
      </div>
      <div class="verdict"><i data-lucide="scale"></i> Close to a coin flip in 10,000 replays · history +0.12R</div>
    </div>

    <div class="glass card-pad">
      <h2 style="margin-bottom:12px">Controls</h2>
      <div class="btns" style="margin-bottom:12px">
        <button class="btn btn-primary"><i data-lucide="plus"></i>Buy</button>
        <button class="btn btn-glass glass"><i data-lucide="minus"></i>Sell</button>
        <button class="btn btn-glass glass"><i data-lucide="upload"></i>Import</button>
      </div>
      <div class="btns"><input class="input" placeholder="Amount to invest (CAD)"></div>
    </div>

    <div class="glass card-pad">
      <h2 style="margin-bottom:12px">Colours for meaning</h2>
      <div class="swatches">
        <div><div class="sw" style="background:var(--gain)"></div><div class="sw-l">gain</div></div>
        <div><div class="sw" style="background:var(--loss)"></div><div class="sw-l">loss</div></div>
        <div><div class="sw" style="background:var(--trim)"></div><div class="sw-l">trim</div></div>
        <div><div class="sw" style="background:var(--attention)"></div><div class="sw-l">review</div></div>
        <div><div class="sw" style="background:var(--hold)"></div><div class="sw-l">hold</div></div>
        <div><div class="sw" style="background:var(--brand)"></div><div class="sw-l">you are here</div></div>
      </div>
    </div>
  </div>

  <nav class="tabbar glass glass-strong glass-liquid">
    <span class="tab on"><i data-lucide="sun"></i>Today</span>
    <span class="tab"><i data-lucide="wallet"></i>Portfolio</span>
    <span class="tab"><i data-lucide="chart-candlestick"></i>Day trade</span>
    <span class="tab"><i data-lucide="search"></i>Search</span>
    <span class="tab"><i data-lucide="ellipsis"></i>More</span>
  </nav>
</template>

<script>
  for (const [id, mode] of [['light', 'Light · daylight glass'], ['dark', 'Dark · night glass']]) {
    const pane = document.getElementById(id)
    pane.append(document.getElementById('tpl').content.cloneNode(true))
    pane.querySelector('[data-mode]').textContent = mode
  }
  lucide.createIcons()
</script>
</body>
</html>
