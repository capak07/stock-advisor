[project]
name = "advisor"
version = "0.1.0"
description = "Stock Advisor data pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "pandas-market-calendars>=4.4",
  "yfinance>=0.2.50",
  "tzdata>=2024.1",
  "pyarrow>=17",
  "lightgbm>=4.5",
  "arch==8.0.0",
]

[project.optional-dependencies]
# Headline sentiment (FinBERT, Plan 2f). The scheduled run installs it; tests run without it.
nlp = ["torch>=2.4", "transformers>=4.44"]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.uv.sources]
# Linux (Docker, GitHub Actions) gets the CPU-only torch wheel, not the multi-GB CUDA build.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only torch comes from this index

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long SQL strings and messages; formatting is not enforced by lint
